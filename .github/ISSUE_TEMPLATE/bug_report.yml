name: Bug Report
description: Report a reproducible problem with CombatKeepInventory.
title: "[Bug]: "
labels:
  - bug
  - needs-triage
type: bug

body:

  # ==========================================================
  # Introduction
  # ==========================================================

  - type: markdown
    attributes:
      value: |
        ## CombatKeepInventory Bug Report

        Thank you for reporting a problem.

        Please provide accurate version, platform, server, Java,
        configuration, reproduction steps, and relevant logs.

        Issues without enough technical information may be closed
        until the required information is provided.


  # ==========================================================
  # Plugin Version
  # ==========================================================

  - type: input
    id: plugin-version
    attributes:
      label: CombatKeepInventory Version
      description: Enter the exact CombatKeepInventory version.
      placeholder: "Example: 1.1.0"
    validations:
      required: true


  # ==========================================================
  # Module
  # ==========================================================

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which CombatKeepInventory module is affected?
      options:
        - Bukkit
        - Velocity
        - Bukkit + Velocity
        - Core API
        - Unknown
    validations:
      required: true


  # ==========================================================
  # Minecraft Version
  # ==========================================================

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version
      description: Enter the exact Minecraft version used by the affected server.
      placeholder: "Example: 1.21.11"
    validations:
      required: true


  # ==========================================================
  # Server Software
  # ==========================================================

  - type: dropdown
    id: server-software
    attributes:
      label: Server Software
      description: Select the server implementation used by the backend.
      options:
        - Paper
        - Spigot
        - Purpur
        - Bukkit
        - Folia
        - Other
        - Not applicable
    validations:
      required: true


  # ==========================================================
  # Server Software Version
  # ==========================================================

  - type: input
    id: server-software-version
    attributes:
      label: Server Software Version
      description: Enter the exact server build/version.
      placeholder: "Example: Paper 1.21.11 build 123"
    validations:
      required: true


  # ==========================================================
  # Java Version
  # ==========================================================

  - type: input
    id: java-version
    attributes:
      label: Java Version
      description: Enter the exact Java runtime version.
      placeholder: "Example: Java 21.0.9"
    validations:
      required: true


  # ==========================================================
  # Velocity
  # ==========================================================

  - type: input
    id: velocity-version
    attributes:
      label: Velocity Version
      description: Enter the Velocity version if a proxy is used. Otherwise enter "Not used".
      placeholder: "Example: Velocity 3.4.0"
    validations:
      required: true


  # ==========================================================
  # Geyser / Floodgate
  # ==========================================================

  - type: dropdown
    id: geyser
    attributes:
      label: Geyser / Bedrock Support
      description: Is Geyser/Floodgate involved in the problem?
      options:
        - Not used
        - Geyser
        - Geyser + Floodgate
        - Unknown
    validations:
      required: true


  # ==========================================================
  # Other Plugins
  # ==========================================================

  - type: textarea
    id: other-plugins
    attributes:
      label: Other Relevant Plugins
      description: List plugins that may interact with CombatKeepInventory, especially combat, protection, proxy, or inventory plugins.
      placeholder: |
        Example:
        WorldGuard 7.0.16
        PvPManager
        Geyser
        Floodgate
        SkinsRestorer
    validations:
      required: true


  # ==========================================================
  # Problem Summary
  # ==========================================================

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Clearly describe the problem and what you observed.
      placeholder: |
        Example:
        CombatTag is not created when player A attacks player B.
    validations:
      required: true


  # ==========================================================
  # Expected Behavior
  # ==========================================================

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe exactly what should have happened.
      placeholder: |
        Example:
        Both players should receive a 10-second CombatTag.
    validations:
      required: true


  # ==========================================================
  # Reproduction Steps
  # ==========================================================

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest reliable sequence of actions that reproduces the issue.
      placeholder: |
        1. Start the server.
        2. Join with two players.
        3. Player A attacks Player B.
        4. Check CombatTag state.
        5. Player B dies.
    validations:
      required: true


  # ==========================================================
  # Reproducibility
  # ==========================================================

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How often can you reproduce the problem?
      options:
        - Every time
        - Usually
        - Sometimes
        - Rarely
        - Unable to reproduce consistently
    validations:
      required: true


  # ==========================================================
  # Configuration
  # ==========================================================

  - type: textarea
    id: configuration
    attributes:
      label: Relevant Configuration
      description: Paste the relevant CombatKeepInventory configuration. Remove passwords, tokens, IPs, or other sensitive information.
      render: yaml
      placeholder: |
        combat:
          enabled: true
          duration-seconds: 10

        death:
          pvp-kill-drops: true
          pve-keeps-inventory: true
          keep-experience: true

        inventory:
          keep-experience: true

        worlds:
          enabled: true
          disabled-worlds: []

        debug:
          combat: true
          damage: true
          death: true
          bridge: true
    validations:
      required: true


  # ==========================================================
  # Logs
  # ==========================================================

  - type: textarea
    id: logs
    attributes:
      label: Relevant Server Logs
      description: Paste the relevant logs around the moment the problem occurs. Do not include sensitive information.
      render: shell
      placeholder: |
        [CombatKeepInventory] [CombatDamage] ...
        [CombatKeepInventory] [CombatTag] ...
        [CombatKeepInventory] [CombatDeath] ...
    validations:
      required: true


  # ==========================================================
  # Stack Trace
  # ==========================================================

  - type: textarea
    id: stack-trace
    attributes:
      label: Exception or Stack Trace
      description: If there is an exception, paste the complete stack trace. Otherwise enter "None".
      render: shell
      placeholder: |
        java.lang.SomeException:
            at ...
    validations:
      required: true


  # ==========================================================
  # Debug Information
  # ==========================================================

  - type: textarea
    id: debug-output
    attributes:
      label: CombatKeepInventory Debug Output
      description: If debug options are enabled, include the relevant CombatTag, damage, death, or bridge output.
      render: shell
      placeholder: |
        [CombatKeepInventory] [CombatDamage] ...
        [CombatKeepInventory] [CombatTag] ...
        [CombatKeepInventory] [CombatDeath] ...
        [CombatKeepInventory] [CombatBridge] ...
    validations:
      required: false


  # ==========================================================
  # Velocity Bridge
  # ==========================================================

  - type: dropdown
    id: bridge
    attributes:
      label: CombatStateBridge Involved
      description: Is the bug related to Bukkit to Velocity CombatStateBridge synchronization?
      options:
        - "No"
        - "Yes"
        - "Unknown"
        - "Not applicable"
    validations:
      required: true


  # ==========================================================
  # WorldGuard
  # ==========================================================

  - type: dropdown
    id: worldguard
    attributes:
      label: WorldGuard Involved
      description: Is WorldGuard involved in the problem?
      options:
        - "No"
        - "Yes"
        - "Unknown"
        - "Not installed"
    validations:
      required: true


  # ==========================================================
  # Bypass Permission
  # ==========================================================

  - type: dropdown
    id: bypass
    attributes:
      label: Bypass Permission Involved
      description: Does the affected player have the CombatKeepInventory bypass permission?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true


  # ==========================================================
  # Clean Test
  # ==========================================================

  - type: dropdown
    id: clean-test
    attributes:
      label: Tested Without Other Plugins
      description: Have you tested the issue with unrelated plugins disabled?
      options:
        - "Yes"
        - "No"
        - "Not possible"
    validations:
      required: true


  # ==========================================================
  # Regression
  # ==========================================================

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      description: Did this work correctly in an earlier CombatKeepInventory version?
      options:
        - "Yes"
        - "No"
        - "Unknown"
        - "First version tested"
    validations:
      required: true


  # ==========================================================
  # Additional Information
  # ==========================================================

  - type: textarea
    id: additional-information
    attributes:
      label: Additional Information
      description: Add screenshots, videos, timings, server topology, or anything else that may help reproduce the issue.
      placeholder: |
        Additional information...
    validations:
      required: false


  # ==========================================================
  # Checklist
  # ==========================================================

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      description: Please confirm the following before submitting the issue.
      options:

        - label: I have provided the exact CombatKeepInventory version.
          required: true

        - label: I have provided the Minecraft and server software versions.
          required: true

        - label: I have provided the Java version.
          required: true

        - label: I have provided reproduction steps.
          required: true

        - label: I have provided relevant logs.
          required: true

        - label: I have removed sensitive information from the report.
          required: true

        - label: I have searched existing issues for the same problem.
          required: true
